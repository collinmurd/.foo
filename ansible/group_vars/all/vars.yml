---
# Non-sensitive variables that reference vault variables
porkbun_cert_directory: "/etc/nginx/ssl"
porkbun_reload_nginx: true

# List of domains to manage certificates for
porkbun_domains:
  - collinmurd.foo
  - collinandalivia.com

# Reference encrypted vault variables
porkbun_api_key: "{{ vault_porkbun_api_key }}"
porkbun_secret_key: "{{ vault_porkbun_secret_key }}"

# Persistent application data storage
storage_device_candidates:
  - /dev/oracleoci/oraclevdb
  - /dev/oracleoci/oraclevdc
  - /dev/sdb
  - /dev/vdb
storage_mount_path: /var/lib/app-data
storage_filesystem_type_name: ext4
storage_mount_options: defaults,nofail
storage_owner_user: root
storage_owner_group: docker
storage_mount_mode: "0775"

# Wedding app container runtime GID (matches node user's GID in the container image)
wedding_app_gid: "2000"
