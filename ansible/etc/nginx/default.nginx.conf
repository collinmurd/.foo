server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name _;
    ssl_certificate /etc/nginx/ssl/collinmurd.foo.cert.pem;
    ssl_certificate_key /etc/nginx/ssl/collinmurd.foo.key.pem;

    return 421;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    return 421;
}