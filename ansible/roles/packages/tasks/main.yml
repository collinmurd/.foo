---
# Install required system packages
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install base packages
  apt:
    name:
      - ca-certificates
      - curl
      - apt-transport-https
      - gnupg
      - lsb-release
      - nginx
      - jq
      - netfilter-persistent
      - iptables-persistent
      - cron
      - python3-pip
    state: present
